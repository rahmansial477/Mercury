<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="silverFlame" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E6DFDA" />
      <stop offset="60%" stop-color="#AD9F9A" />
      <stop offset="100%" stop-color="#4A3F40" />
    </linearGradient>

    <linearGradient id="mauveFlame" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#C4B4B5" />
      <stop offset="35%" stop-color="#7A686A" />
      <stop offset="75%" stop-color="#403335" />
      <stop offset="100%" stop-color="#1A1213" />
    </linearGradient>

    <radialGradient id="dropletCore" cx="35%" cy="30%" r="70%">
