      <stop offset="50%" stop-color="#2A2021" />
      <stop offset="100%" stop-color="#0F0B0C" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" fill="#000000" />

  <g>
    <!-- Deepest Back Dark Flame Silhouette -->
    <path d="M 50 95 C 44 86 16 68 14 48 C 12 32 22 18 30 10 C 26 22 30 32 36 38 C 30 26 38 12 48 4 C 42 18 48 28 54 34 C 52 22 62 12 70 8 C 66 22 72 32 78 38 C 84 26 88 38 86 52 C 84 70 56 86 50 95 Z" fill="url(#darkBackFlame)" stroke="#080607" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Outer Left Silver Swoop Flame Tendril -->
    <path d="M 50 95 C 42 84 18 64 20 48 C 22 36 30 26 36 20 C 30 28 32 38 38 46 C 34 52 32 60 38 68 C 42 74 48 82 50 95 Z" fill="url(#silverFlame)" stroke="#080607" stroke-width="2" stroke-linejoin="round" />

    <!-- Main Center-Left Tall Silver Flame Tip -->
    <path d="M 50 95 C 46 80 34 62 38 44 C 40 34 36 22 48 4 C 40 18 44 32 50 40 C 52 46 50 56 48 66 C 46 76 48 88 50 95 Z" fill="url(#silverFlame)" stroke="#080607" stroke-width="2" stroke-linejoin="round" />

    <!-- Right Mauve Flame Tendrils -->
    <path d="M 50 95 C 52 86 58 74 58 64 C 58 54 52 44 56 36 C 60 30 68 22 70 8 C 64 20 66 30 72 38 C 76 44 80 36 82 46 C 84 58 76 72 64 82 C 58 88 52 92 50 95 Z" fill="url(#mauveFlame)" stroke="#080607" stroke-width="2" stroke-linejoin="round" />

    <!-- Inner Mauve Flame Layer behind Droplet -->
    <path d="M 50 90 C 52 82 60 70 60 58 C 60 48 54 40 58 32 C 60 26 66 18 68 12 C 64 22 62 30 66 38 C 68 44 70 54 66 66 C 60 78 52 86 50 90 Z" fill="url(#mauveFlame)" stroke="#080607" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Central Mercury Liquid Teardrop / Droplet -->
    <path d="M 50 42 C 40 50 36 60 40 70 C 44 78 54 78 58 70 C 62 60 58 50 50 42 Z" fill="#181213" stroke="#080607" stroke-width="2" />
    <path d="M 50 45 C 42 52 38 61 42 69 C 45 75 53 75 56 69 C 60 61 56 52 50 45 Z" fill="url(#dropletCore)" stroke="#080607" stroke-width="1.5" />

    <!-- Specular Highlight -->
    <ellipse cx="45" cy="56" rx="2" ry="4" transform="rotate(-20 45 56)" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
